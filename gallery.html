<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图提取 · 图片画廊</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <!-- 顶部工具栏：来源信息 + 筛选 + 全选/反选/下载 -->
  <header class="topbar">
    <div class="topbar__brand">
      <span class="brand__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="3"></rect>
          <circle cx="9" cy="10" r="1.6"></circle>
          <path d="M4 17l4.5-4.5 3.2 3.2 2.3-2.3L20 17"></path>
        </svg>
      </span>
      <div class="brand__text">
        <strong>图提取</strong>
        <span id="source-label" class="brand__sub">等待提取结果…</span>
      </div>
    </div>

    <div class="topbar__controls">
      <label class="field">
        <span>文件名前缀</span>
        <input id="prefix-input" type="text" value="商品图" maxlength="20" spellcheck="false">
      </label>

      <label class="field">
        <span>最小尺寸</span>
        <select id="min-size">
          <option value="0">不限</option>
          <option value="100" selected>100 × 100</option>
          <option value="300">300 × 300</option>
          <option value="600">600 × 600</option>
        </select>
      </label>

      <button id="select-all" class="btn btn--ghost" type="button">全选</button>
      <button id="invert" class="btn btn--ghost" type="button">反选</button>
      <span id="selected-count" class="pill">已选 0 张</span>
      <button id="download" class="btn btn--primary" type="button" disabled>下载选中</button>
    </div>
  </header>

  <!-- 下载进度条 -->
  <div id="progress" class="progress" hidden>
    <div class="progress__bar"><span id="progress-fill"></span></div>
    <span id="progress-text" class="progress__text">0 / 0</span>
  </div>

  <!-- 主体：图片网格 -->
  <main class="content">
    <div id="empty" class="empty">
      <div class="empty__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="3"></rect>
          <path d="M3 16l5-5 4 4 3-3 6 6"></path>
        </svg>
      </div>
      <h2 id="empty-title">还没有提取到图片</h2>
      <p id="empty-desc">请打开淘宝 / 京东 / 拼多多商家版的商品详情页，点击右下角「获取图片」。</p>
      <p id="source-link-wrap" class="empty__link" hidden>
        也可以直接查看来源页：<a id="source-link" href="#" target="_blank" rel="noreferrer">打开商品页</a>
      </p>
    </div>

    <div id="grid" class="grid" role="list"></div>
  </main>

  <!-- 结果提示 -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <footer class="footer">
    <span>图提取 ImageGrab v1.0.0 · 勾选后统一转 PNG，保存到浏览器默认下载目录</span>
  </footer>

  <script src="gallery.js"></script>
</body>
</html>
